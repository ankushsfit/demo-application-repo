name: Trigger Automation Tests


on:
  push:
    branches:
      - main


jobs:

  trigger-automation:

    runs-on: ubuntu-latest


    steps:

      - name: Trigger Automation Repository

        run: |

          curl \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.AUTOMATION_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/ankushsfit/demo-automation-repo/dispatches \
          -d '{"event_type":"run-tests"}'
